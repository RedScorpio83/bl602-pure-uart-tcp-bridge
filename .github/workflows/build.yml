name: Build Pure BL602 Bridge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Bouffalo Lab SDK
        run: |
          git clone --depth 1 https://github.com/bouffalolab/bl_iot_sdk.git

      - name: Overwrite bl602_demo_wifi main.c with Pure Bridge
        run: |
          cp main.c bl_iot_sdk/customer_app/bl602_demo_wifi/bl602_demo_wifi/main.c

      - name: Compile with Bouffalo RISC-V Toolchain
        run: |
          export BL60X_SDK_PATH=$(pwd)/bl_iot_sdk
          export PATH=$(pwd)/bl_iot_sdk/toolchain/riscv/Linux/bin:$PATH
          cd bl_iot_sdk/customer_app/bl602_demo_wifi
          make

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BL602_PURE_BRIDGE_BIN
          path: bl_iot_sdk/customer_app/bl602_demo_wifi/build_out/*.bin
